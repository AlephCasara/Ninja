<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Ninja pipeline</title>
  <desc id="desc">Pipeline from public information to Master Trader through acquisition, normalization, six scouts, validation and deterministic policy.</desc>
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 2; rx: 18; ry: 18; }
      .group { fill: #0f172a; stroke: #475569; stroke-width: 2; rx: 24; ry: 24; }
      .box { fill: #1e293b; stroke: #64748b; stroke-width: 2; rx: 16; ry: 16; }
      .box2 { fill: #172554; stroke: #60a5fa; stroke-width: 2; rx: 16; ry: 16; }
      .decision { fill: #1f2937; stroke: #f59e0b; stroke-width: 2; }
      .reject { fill: #3f1d1d; stroke: #f87171; stroke-width: 2; rx: 16; ry: 16; }
      .ok { fill: #132e25; stroke: #4ade80; stroke-width: 2; rx: 16; ry: 16; }
      .title { fill: #f8fafc; font: 700 34px Arial, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 500 18px Arial, sans-serif; }
      .label { fill: #e5e7eb; font: 600 20px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #cbd5e1; font: 500 14px Arial, sans-serif; }
      .groupTitle { fill: #93c5fd; font: 700 20px Arial, sans-serif; }
      .rule { fill: #f8fafc; font: italic 700 26px Georgia, serif; text-anchor: middle; }
      .legend { fill: #94a3b8; font: 500 15px Arial, sans-serif; }
      .arrow { stroke: #cbd5e1; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrowSoft { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrowSoft); }
      .arrowGreen { stroke: #4ade80; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .arrowRed { stroke: #f87171; stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
      .arrowAmber { stroke: #f59e0b; stroke-width: 3; fill: none; marker-end: url(#arrowAmber); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4ade80"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#f87171"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="980"/>

  <text x="70" y="70" class="title">From internet noise to deterministic action</text>
  <text x="70" y="104" class="subtitle">Ninja transforms unstructured public information into validated, versioned inputs that Master Trader can consume deterministically.</text>

  <rect class="group" x="60" y="140" width="1280" height="185"/>
  <text x="86" y="172" class="groupTitle">1) Information layer</text>

  <rect class="group" x="60" y="355" width="1280" height="295"/>
  <text x="86" y="387" class="groupTitle">2) Research and factor construction</text>

  <rect class="group" x="60" y="680" width="1280" height="185"/>
  <text x="86" y="712" class="groupTitle">3) Validation and execution</text>

  <rect class="box" x="110" y="210" width="230" height="70"/>
  <text x="225" y="238" class="label">Public information</text>
  <text x="225" y="262" class="small" text-anchor="middle">social • news • official sources</text>

  <rect class="box" x="410" y="210" width="180" height="70"/>
  <text x="500" y="245" class="label">Acquisition</text>

  <rect class="box" x="660" y="210" width="220" height="70"/>
  <text x="770" y="238" class="label">Timestamped</text>
  <text x="770" y="262" class="small" text-anchor="middle">observations</text>

  <rect class="box" x="950" y="210" width="280" height="70"/>
  <text x="1090" y="238" class="label">Normalization &amp;</text>
  <text x="1090" y="262" class="small" text-anchor="middle">semantic extraction</text>

  <path class="arrow" d="M340 245 L410 245"/>
  <path class="arrow" d="M590 245 L660 245"/>
  <path class="arrow" d="M880 245 L950 245"/>

  <rect class="panel" x="105" y="430" width="1190" height="140"/>
  <text x="130" y="455" class="groupTitle">Six Ninja Scouts</text>

  <rect class="box2" x="130" y="485" width="155" height="58"/>
  <text x="208" y="514" class="label">Attention</text>

  <rect class="box2" x="315" y="485" width="155" height="58"/>
  <text x="392" y="514" class="label">Divergence</text>

  <rect class="box2" x="500" y="485" width="155" height="58"/>
  <text x="578" y="514" class="label">Narrative</text>

  <rect class="box2" x="685" y="485" width="155" height="58"/>
  <text x="762" y="514" class="label">Propagation</text>

  <rect class="box2" x="870" y="485" width="175" height="58"/>
  <text x="957" y="505" class="label">Event</text>
  <text x="957" y="526" class="small" text-anchor="middle">morphology</text>

  <rect class="box2" x="1075" y="485" width="175" height="58"/>
  <text x="1162" y="514" class="label">Susceptibility</text>

  <rect class="box" x="520" y="590" width="300" height="70"/>
  <text x="670" y="618" class="label">Ninja State</text>
  <text x="670" y="642" class="small" text-anchor="middle">versioned feature-vector candidate</text>

  <path class="arrowSoft" d="M208 543 C208 575, 285 575, 520 625"/>
  <path class="arrowSoft" d="M392 543 C392 572, 455 580, 540 625"/>
  <path class="arrowSoft" d="M578 543 C578 570, 600 585, 590 625"/>
  <path class="arrowSoft" d="M762 543 C762 570, 740 585, 750 625"/>
  <path class="arrowSoft" d="M957 543 C957 572, 885 580, 800 625"/>
  <path class="arrowSoft" d="M1162 543 C1162 575, 1085 575, 820 625"/>

  <path class="arrow" d="M1090 280 L1090 360 L670 360 L670 430"/>

  <polygon class="decision" points="260,772 390,704 520,772 390,840"/>
  <text x="390" y="762" class="label">Historical</text>
  <text x="390" y="786" class="small" text-anchor="middle">validation</text>

  <rect class="reject" x="110" y="742" width="110" height="60"/>
  <text x="165" y="775" class="label">Reject</text>

  <rect class="ok" x="590" y="742" width="180" height="60"/>
  <text x="680" y="768" class="label">Versioned factor</text>
  <text x="680" y="790" class="small" text-anchor="middle">survives OOS</text>

  <rect class="box" x="850" y="742" width="190" height="60"/>
  <text x="945" y="768" class="label">Prospective shadow</text>
  <text x="945" y="790" class="small" text-anchor="middle">log only • no trade changes</text>

  <rect class="box" x="1110" y="742" width="160" height="60"/>
  <text x="1190" y="768" class="label">Deterministic</text>
  <text x="1190" y="790" class="small" text-anchor="middle">policy</text>

  <rect class="box2" x="1115" y="885" width="160" height="58"/>
  <text x="1195" y="915" class="label">Master Trader</text>

  <path class="arrow" d="M670 660 L670 700 L520 772"/>
  <path class="arrowRed" d="M260 772 L220 772"/>
  <text x="238" y="738" class="legend">fails</text>

  <path class="arrowGreen" d="M520 772 L590 772"/>
  <text x="540" y="738" class="legend">survives OOS</text>

  <path class="arrow" d="M770 772 L850 772"/>
  <path class="arrow" d="M1040 772 L1110 772"/>
  <path class="arrowAmber" d="M1190 802 L1195 885"/>
  <text x="1210" y="850" class="legend">approved</text>

  <text x="70" y="915" class="groupTitle">Core rule</text>
  <rect x="340" y="887" width="550" height="56" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <text x="615" y="922" class="rule">Information → Evidence → Policy</text>
  <text x="70" y="947" class="legend">Information never becomes trading action directly.</text>
</svg>