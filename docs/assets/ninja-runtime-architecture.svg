<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ninja research to Master Trader runtime architecture</title>
  <desc id="desc">Ninja research validates deterministic strategies and modules which run as a family of bots inside Master Trader. Live collectors provide typed data to Ninja bots. A global switch enables or disables the Ninja family.</desc>
  <defs>
    <style>
      .bg{fill:#0b1220}.group{fill:#0f172a;stroke:#475569;stroke-width:2}.box{fill:#1e293b;stroke:#64748b;stroke-width:2}.blue{fill:#172554;stroke:#60a5fa;stroke-width:2}.green{fill:#132e25;stroke:#4ade80;stroke-width:2}.amber{fill:#2b2113;stroke:#f59e0b;stroke-width:2}.muted{fill:#111827;stroke:#334155;stroke-width:2}.title{fill:#f8fafc;font:700 34px Arial,sans-serif}.sub{fill:#cbd5e1;font:500 18px Arial,sans-serif}.gt{fill:#93c5fd;font:700 21px Arial,sans-serif}.label{fill:#e5e7eb;font:600 19px Arial,sans-serif;text-anchor:middle}.small{fill:#cbd5e1;font:500 14px Arial,sans-serif;text-anchor:middle}.note{fill:#94a3b8;font:500 14px Arial,sans-serif}.arrow{stroke:#cbd5e1;stroke-width:3;fill:none;marker-end:url(#a)}.arrowBlue{stroke:#60a5fa;stroke-width:3;fill:none;marker-end:url(#ab)}.arrowGreen{stroke:#4ade80;stroke-width:3;fill:none;marker-end:url(#ag)}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#as)}
    </style>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#cbd5e1"/></marker>
    <marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#60a5fa"/></marker>
    <marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#4ade80"/></marker>
    <marker id="as" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#94a3b8"/></marker>
  </defs>
  <rect class="bg" width="1500" height="1000"/>
  <text x="60" y="62" class="title">Ninja: research → validated deterministic bots in Master Trader</text>
  <text x="60" y="96" class="sub">Research may be probabilistic. Runtime Ninjas are ordinary Python strategies/modules with frozen behavior.</text>

  <rect class="group" x="55" y="135" rx="22" ry="22" width="1390" height="355"/>
  <text x="85" y="170" class="gt">Ninja repository — research and validation</text>
  <rect class="box" x="95" y="215" rx="14" ry="14" width="230" height="82"/>
  <text x="210" y="247" class="label">Historical information</text>
  <text x="210" y="273" class="small">social • news • official sources</text>
  <rect class="box" x="95" y="330" rx="14" ry="14" width="230" height="82"/>
  <text x="210" y="362" class="label">Market history</text>
  <text x="210" y="388" class="small">OHLCV • funding • OI • liquidity</text>

  <rect class="blue" x="390" y="205" rx="16" ry="16" width="470" height="215"/>
  <text x="625" y="238" class="label">Six research domains</text>
  <text x="495" y="282" class="small">Attention</text>
  <text x="625" y="282" class="small">Divergence</text>
  <text x="755" y="282" class="small">Narrative</text>
  <text x="495" y="326" class="small">Propagation</text>
  <text x="625" y="326" class="small">Event morphology</text>
  <text x="755" y="326" class="small">Susceptibility</text>
  <text x="625" y="382" class="note" text-anchor="middle">Research lenses, not six mandatory runtime services.</text>

  <rect class="amber" x="925" y="215" rx="14" ry="14" width="220" height="82"/>
  <text x="1035" y="247" class="label">Experiments</text>
  <text x="1035" y="273" class="small">OOS • walk-forward • ablation</text>
  <rect class="green" x="1190" y="205" rx="16" ry="16" width="215" height="220"/>
  <text x="1298" y="240" class="label">Validated artifacts</text>
  <text x="1298" y="282" class="small">strategy.py</text>
  <text x="1298" y="310" class="small">feature module</text>
  <text x="1298" y="338" class="small">feed contract</text>
  <text x="1298" y="366" class="small">parameters</text>
  <text x="1298" y="394" class="small">validation manifest</text>

  <path class="arrow" d="M325 256 L390 256"/>
  <path class="arrow" d="M325 371 L390 371"/>
  <path class="arrow" d="M860 312 L925 256"/>
  <path class="arrowGreen" d="M1145 256 L1190 256"/>

  <rect class="group" x="55" y="535" rx="22" ry="22" width="1390" height="395"/>
  <text x="85" y="570" class="gt">Master Trader runtime — deterministic fleet</text>
  <rect class="muted" x="90" y="620" rx="14" ry="14" width="230" height="105"/>
  <text x="205" y="655" class="label">Existing bots</text>
  <text x="205" y="685" class="small">FundingFade • Keltner</text>
  <text x="205" y="708" class="small">OITrend • Killers • ...</text>

  <rect class="blue" x="380" y="600" rx="18" ry="18" width="575" height="215"/>
  <text x="667" y="632" class="label">Ninja family</text>
  <text x="667" y="658" class="small">NINJA_ENABLED controls the family; each Ninja retains its own active / dry-run config.</text>
  <rect class="box" x="415" y="690" rx="13" ry="13" width="155" height="72"/>
  <text x="492" y="718" class="label">Ninja A</text>
  <text x="492" y="744" class="small">deterministic Python</text>
  <rect class="box" x="590" y="690" rx="13" ry="13" width="155" height="72"/>
  <text x="667" y="718" class="label">Ninja B</text>
  <text x="667" y="744" class="small">deterministic Python</text>
  <rect class="box" x="765" y="690" rx="13" ry="13" width="155" height="72"/>
  <text x="842" y="718" class="label">Ninja C</text>
  <text x="842" y="744" class="small">deterministic Python</text>

  <rect class="box" x="1010" y="615" rx="14" ry="14" width="185" height="112"/>
  <text x="1102" y="648" class="label">Shared risk</text>
  <text x="1102" y="676" class="small">portfolio breaker</text>
  <text x="1102" y="700" class="small">monitoring • limits</text>
  <rect class="green" x="1250" y="615" rx="14" ry="14" width="160" height="112"/>
  <text x="1330" y="651" class="label">Execution</text>
  <text x="1330" y="680" class="small">Freqtrade / receivers</text>
  <text x="1330" y="704" class="small">exchange orders</text>

  <rect class="muted" x="1000" y="785" rx="14" ry="14" width="410" height="100"/>
  <text x="1205" y="815" class="label">Live information feeds for Ninjas that need them</text>
  <text x="1205" y="844" class="small">Last30Days • crawlers • public sources • feature calculation</text>
  <text x="1205" y="868" class="small">same pattern as existing external funding / OI inputs</text>

  <path class="arrow" d="M320 672 L1010 672"/>
  <path class="arrow" d="M955 672 L1010 672"/>
  <path class="arrowGreen" d="M1195 672 L1250 672"/>
  <path class="dash" d="M1205 785 C1100 760 965 745 920 730"/>
  <path class="arrowBlue" d="M1298 425 C1298 510 900 510 842 600"/>
  <text x="1085" y="520" class="note">validated implementation enters the Master Trader fleet</text>

  <text x="85" y="906" class="note">A research feature vector may exist for analysis, but there is no mandatory runtime “Ninja State” service or generic policy engine.</text>
</svg>