[workspace]
members = ["crates/ninja-tooling"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/AlephCasara/Ninja"

[workspace.dependencies]
anyhow = "1"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
