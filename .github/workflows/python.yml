name: Python

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: latest-known
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Resolve environment
        run: uv sync --all-groups

      - name: Test
        run: uv run pytest

      - name: Scientific validation selftest
        shell: bash
        run: |
          uv run ninja-labs validation selftest --output /tmp/ninja-validation-selftest.json
          cat /tmp/ninja-validation-selftest.json

      - name: E1 estimator validation
        shell: bash
        run: |
          uv run ninja-labs validation e1-attention --output /tmp/ninja-e1-estimator-validation.json
          cat /tmp/ninja-e1-estimator-validation.json

      - name: E1 Monte Carlo estimator validation
        shell: bash
        run: |
          uv run ninja-labs validation e1-monte-carlo --worlds 64 --output /tmp/ninja-e1-monte-carlo.json
          cat /tmp/ninja-e1-monte-carlo.json
