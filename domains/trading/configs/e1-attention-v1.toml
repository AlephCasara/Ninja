# LEGACY E1 v1 experiment-specific configuration. Not the default Ninja backtesting contract.
# New sessions use ExperimentSpec v2 / docs/BACKTESTING_SESSION.md.
# E1 preregistration configuration.
# This file is sealed together with the canonical dataset manifest before any
# train/validation outcome is inspected. Any scientific change after sealing
# requires a new experiment version rather than mutating this one.

[experiment]
id = "E1-attention-btc-reddit-v1"
hypothesis = "N1"
stage = "train_validation"
base_interval = "15m"
random_seed = 20261013
minimum_relative_loss_improvement = 0.005

[data]
# Supplied at runtime because the canonical manifest ID is created when the
# 2021-2025 corpus is materialized.
allowed_splits = ["train", "validation"]
forbidden_splits = ["untouched_test"]

[data_quality]
# These are structural/acquisition gates, frozen before the canonical corpus is
# inspected for predictive outcomes. They catch catastrophic missingness rather
# than optimizing a threshold against market performance.
min_archive_capture_fraction = 0.95
max_source_timestamp_fraction = 0.05
required_years = [2021, 2022, 2023, 2024, 2025]
min_observations_per_year = 1000
required_communities = ["Bitcoin", "CryptoCurrency"]
min_observations_per_community = 1000
min_market_span_coverage_fraction = 0.9999
min_aligned_split_coverage_fraction = 0.999
min_nonzero_attention_fraction = 0.05

[confirmatory]
# Frozen before real train/validation outcomes. Four hours is the primary
# horizon because it is long enough for public-attention transmission while
# avoiding the heavy label overlap of 24h and the timestamp sensitivity of 15m.
primary_target = "future_rv"
primary_horizon_bins = 16
primary_candidate = "market_plus_seasonal_attention"
primary_loss = "mse"
minimum_relative_loss_improvement = 0.005
alpha = 0.05

[attention]
# Simple rolling AZ is retained as a diagnostic baseline only; controlled-world
# tests showed strong residual daily seasonality. The primary normalized feature
# compares each 15-minute bin only with the same weekly phase in prior weeks.
rolling_az_lookback = 96
seasonal_period = 672        # same 15-minute slot of the week
seasonal_cycles = 8          # eight prior weeks, causal only
zero_mad_policy = "poisson"

[targets]
horizons_bins = [1, 4, 16, 96]  # 15m, 1h, 4h, 24h
jump_sigma = 3.0

[market_features]
rv_windows_bins = [4, 16, 96]
volume_reference_bins = 96
include_calendar_phase = true

[models]
regression = "ridge"
ridge_alpha = 1.0
classification = "logistic_regression"
logistic_c = 1.0
max_iter = 2000

[validation]
bootstrap_block_size = 96
bootstrap_resamples = 499
fdr_alpha = 0.05
embargo_bins = 96

[robustness]
# Frozen before empirical E1. These gates determine whether 2025 may be opened.
validation_time_blocks = 4
min_positive_validation_blocks = 3
require_drop_best_block_positive = true
leave_one_train_year_out = [2021, 2022, 2023]
min_positive_leave_one_year_runs = 2
negative_control_runs = 32
negative_control_block_size = 96
max_negative_control_success_fraction = 0.10
require_observed_gain_above_negative_control_p95 = true

[feature_groups]
market_only = []
market_plus_raw_count = ["message_count"]
market_plus_seasonal_attention = ["seasonal_attention_surprise", "attention_acceleration"]
market_plus_attention_structure = ["message_count", "unique_author_count", "author_breadth", "author_hhi", "author_entropy_normalized"]
market_plus_all_validated = ["message_count", "seasonal_attention_surprise", "attention_acceleration", "unique_author_count", "author_breadth", "author_hhi", "author_entropy_normalized"]

[interpretation]
# Only the exact confirmatory target/horizon/candidate above may be called the
# primary N1 test. Everything else is secondary/exploratory even if its p-value
# is numerically stronger.
secondary_targets = ["future_rv", "future_volume_surprise", "jump", "mae"]
secondary_horizons_bins = [1, 4, 96]
exploratory_candidates = ["market_plus_raw_count", "market_plus_attention_structure", "market_plus_all_validated"]

[reporting]
result_states = ["SUPPORTED", "WEAK", "INCONCLUSIVE", "REJECTED", "INVALID"]
report_raw_n = true
report_effective_n = true
report_all_trials = true

[final_test]
locked = true
split = "untouched_test"
require_preregistration_seal = true
require_final_test_seal = true
single_access_ledger = true
